# Fixed project name: keeps the volumes (lemio_postgres_data holds the
# database) and container names the same whatever folder this is run from.
name: lemio

services:
  server:
    # Come back up after a reboot (nginx-proxy already has restart: always).
    restart: unless-stopped
    # Explicit image names, so the images deploy.sh ships are the ones the
    # server runs (otherwise Compose names them <folder>-server).
    image: calyps-server
    build:
      context: ./server
      dockerfile: Dockerfile.prod
    # Long timeout: recipe-card scanning runs OCR on the CPU (the first scan also loads the model).
    command: gunicorn server.wsgi:application --bind 0.0.0.0:8000 --timeout 120
    # command: gunicorn --config ./server/gunicorn_config.py server.wsgi:application 
    env_file:
      - ./server/.env.prod
    environment:
      DJANGO_SETTINGS_MODULE: server.settings
      # Recipe-card scanning needs ~1.6 GB of RAM for EasyOCR; the 2 GB droplet
      # can't spare it. Any non-importable value makes the scan endpoint answer
      # "isn't available right now". Remove this line once the droplet has 4 GB.
      RECIPE_SCAN_EXTRACTOR: disabled
    volumes:
      - static_volume:/home/app/web/staticfiles
      - media_volume:/home/app/web/mediafiles
    expose:
      - 8000
    # ports:
    #   - 8000:8000
    depends_on:
      - db

  client:
    # Come back up after a reboot (nginx-proxy already has restart: always).
    restart: unless-stopped
    image: client
    # volumes:
      # - ./client:/usr/src/app
      # # - node_modules:/usr/src/app/node_modules
      # - /usr/src/app/node_modules
    build:
      context: ./client
      dockerfile: ./Dockerfile.prod
    env_file:
      - ./client/.env.prod
    environment:
      # adapter-node's default is 512K; recipe-card photos can be several MB.
      BODY_SIZE_LIMIT: 16M
    # ports:
    #   - 3000:3000
    expose:
      - 3000
    depends_on:
      - server
      
  db:
    # Come back up after a reboot (nginx-proxy already has restart: always).
    restart: unless-stopped
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - ./server/.env.prod.db

  nginx-proxy:
    container_name: nginx-proxy
    image: calyps-nginx-proxy
    build: ./nginx
    restart: always
    ports:
      - 80:80
      - 443:443
      # - 1337:80
      
    volumes:
      - static_volume:/home/app/web/staticfiles
      - media_volume:/home/app/web/mediafiles
      - certs:/etc/nginx/certs
      - html:/usr/share/nginx/html
      - vhost:/etc/nginx/vhost.d
      - /var/run/docker.sock:/tmp/docker.sock:ro
    depends_on:
      - server
      - client
  acme-companion:
    # Come back up after a reboot (nginx-proxy already has restart: always).
    restart: unless-stopped
    image: nginxproxy/acme-companion
    env_file:
      - ./server/.env.prod.proxy-companion
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - certs:/etc/nginx/certs
      - html:/usr/share/nginx/html
      - vhost:/etc/nginx/vhost.d
      - acme:/etc/acme.sh
    depends_on:
      - nginx-proxy

volumes:
  postgres_data:
  static_volume:
  media_volume:
  certs:
  html:
  vhost:
  acme:
  # node_modules:
